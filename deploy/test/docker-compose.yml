# Приложение СТО на ТЕСТ-стенде (185): один контейнер за Traefik тест-сайта,
# в его же сетях — web (Traefik, certresolver letsencrypt) и supabase-aa_default.
# Образ собирается на самом сервере из архива исходников (см. README,
# «Тест-стенд»); публичные build-аргументы — build.env рядом, секреты —
# ${HOME}/abkhaz-business/.env.production (sudo на стенде нет: ни /etc, ни /srv не пишутся).
#
#   docker compose -f deploy/test/docker-compose.yml up -d
name: abkhaz-business-test
services:
  business:
    container_name: abkhaz-business-test
    image: ${BUSINESS_IMAGE:-abkhaz-business:test}
    restart: always
    env_file:
      - ${HOME}/abkhaz-business/.env.production
    # Потолки и здоровье — как в проде (deploy/prod), чтобы стенд ловил
    # проблемы памяти и зависаний до выката, а не после.
    mem_limit: 768m
    cpus: "1.0"
    environment:
      NODE_OPTIONS: --max-old-space-size=512
    networks: [web, supabase-aa]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      # start_interval — частые пробы только на старте (требует Docker Engine
      # ≥25; на серверах 29.x).
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 3s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3", compress: "true" }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.business-test.rule=Host(`business.abkhaz-auto.apsoftgroup.ru`)"
      - "traefik.http.routers.business-test.entrypoints=websecure"
      - "traefik.http.routers.business-test.tls.certresolver=letsencrypt"
      - "traefik.http.services.business-test.loadbalancer.server.port=3000"
networks:
  web:
    external: true
  supabase-aa:
    external: true
    name: supabase-aa_default
