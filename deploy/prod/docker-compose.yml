# Приложение СТО в ПРОДЕ (сервер 170): один контейнер за боевым Traefik,
# в его же сетях — web (certresolver letsencrypt) и сеть Supabase.
# Хосты business.abkhaz-auto.ru и sto.abkhaz-auto.ru (старое имя) — поддомены боевого сайта: кука сессии выдаётся
# сайтом на .abkhaz-auto.ru и потому доходит сюда (deploy/prod/build.env).
#
# Веб-стек сайта поднимается ТОЛЬКО через bluegreen.sh; это отдельное
# приложение со своим контейнером, оно к blue-green не относится и катится
# самостоятельно:
#
#   docker compose -f deploy/prod/docker-compose.yml up -d
#
# Секреты — /data/abkhaz-business/.env.production (сервисный ключ боевого Supabase,
# SUPABASE_INTERNAL_URL, SITE_INTERNAL_URL, STO_TICKET_*,
# NEXT_SERVER_ACTIONS_ENCRYPTION_KEY). В образ они не попадают.
name: abkhaz-business-prod
services:
  business:
    container_name: abkhaz-business-prod
    image: ${BUSINESS_IMAGE:-abkhaz-business:prod}
    restart: always
    env_file:
      - /data/abkhaz-business/.env.production
    # Потолки: приложение делит сервер с сайтом и базой, и разбухший или
    # зациклившийся контейнер не должен съесть их память и CPU. Куча V8
    # ограничена НИЖЕ mem_limit: так Node жмёт сборку мусора заранее, а не
    # умирает по OOM-kill без стека; зазор — на буферы, стеки и сам рантайм.
    mem_limit: 768m
    cpus: "1.0"
    environment:
      NODE_OPTIONS: --max-old-space-size=512
    networks: [web, supabase-aa]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      # Жёстче прежних 30s/15s/6: зависший контейнер должен быть помечен
      # unhealthy за ~минуту, а не за четыре. start_interval — частые пробы
      # только на старте (требует Docker Engine ≥25; на серверах 29.x).
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 3s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3", compress: "true" }
    labels:
      - "traefik.enable=true"
      # ⚠️ sto.abkhaz-auto.ru — ХОСТ ПЕРВОЙ СБОРКИ, И ОН ОБЯЗАН ОТВЕЧАТЬ.
      # 15.09.2026 приложение называлось «Абхаз Авто СТО», и WebView той сборки
      # прибит к sto.abkhaz-auto.ru (lib/core/env.dart той ветки). 16.09 хост
      # переименовали в business.abkhaz-auto.ru, а старый остался без маршрута:
      # Traefik отдавал по нему свой самоподписанный CN=TRAEFIK DEFAULT CERT и
      # 404. Для WKWebView это обрыв на рукопожатии TLS (NSURLError -1202), а
      # оболочка рисует на любой такой отказ «Нет подключения к интернету» —
      # владелец видел именно это при живом интернете.
      #
      # Отдаём по нему то же приложение, а не заглушку: пути у старой сборки те
      # же (/segodnya, /kalendar, /uslugi, /raspisanie), кука сессии выдаётся на
      # .abkhaz-auto.ru и доходит на оба поддомена. Старые установки оживают
      # без выкладки новой сборки в TestFlight.
      - "traefik.http.routers.business-prod.rule=Host(`business.abkhaz-auto.ru`) || Host(`sto.abkhaz-auto.ru`)"
      - "traefik.http.routers.business-prod.entrypoints=websecure"
      - "traefik.http.routers.business-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.business-prod.loadbalancer.server.port=3000"
      # Свой редирект с http, чтобы не зависеть от глобальных правил стенда;
      # имена middleware отдельные — с роутерами сайта не пересекаются.
      - "traefik.http.routers.business-prod-http.rule=Host(`business.abkhaz-auto.ru`) || Host(`sto.abkhaz-auto.ru`)"
      - "traefik.http.routers.business-prod-http.entrypoints=web"
      - "traefik.http.routers.business-prod-http.middlewares=business-prod-https"
      - "traefik.http.middlewares.business-prod-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.business-prod-https.redirectscheme.permanent=true"
networks:
  web:
    external: true
  supabase-aa:
    external: true
    # Имя сети боевого стека Supabase. Сверить перед первым выкатом:
    # docker network ls | grep supabase
    name: supabase-aa_default
